; DoubtSpan - triple-screen launcher for Shadows of Doubt
; Defaults for a centre 2560x1440 display and two 1920x1080 side displays
; promoted temporarily by NVIDIA DSR/DLDSR to an effective 2560x1440.

[Game]
; Leave blank to auto-detect the Steam installation.
InstallRoot=
Executable=Shadows of Doubt.exe
ProcessName=Shadows of Doubt
SteamAppId=986130
AutoLaunch=true
; Direct launch avoids Steam's "custom arguments" confirmation. The wrapper
; supplies SteamAppId/SteamGameId only to the child process.
LaunchViaSteam=false
RequireClosedBeforePrepare=true

[Layout]
; Uses the horizontal monitor row containing the primary display.
RequiredMonitors=3
RequirePrimaryInMiddle=true
RequireEqualHeight=true

[Display]
; Select an already exposed 2560x1440 DSR/DLDSR mode on each 1080p side.
AutoPromoteToPrimary=true
Require100PercentScale=true
RestoreAfterGame=true

[Window]
WaitSeconds=240
RemoveBorders=true
IntervalMilliseconds=750
TolerancePixels=2
MaxConsecutiveCorrections=12
RepairCursorClip=true

[Preferences]
; The game and Unity both keep display state in this registry key.
RegistryPath=Software\ColePowered Games\Shadows of Doubt
Backup=true
RestoreAfterGame=true
WindowedMode=3
UseNativeResolution=false

[Launch]
; Unity's popup window flag complements the external border removal.
Arguments=-screen-fullscreen 0 -window-mode borderless -popupwindow
